<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { CanvasPage } from '/src/pages/CanvasPage.tsx'
      import { FrameView } from '/src/components/FrameView.tsx'
      import { Stage } from '/src/components/Stage.tsx'
      import { TooltipProvider } from '/src/components/ui/tooltip.tsx'
      import { useStore } from '/src/lib/store.ts'
      import '/src/styles.css'

      const query = new URLSearchParams(location.search)
      const canvasId = query.get('fixtureCanvasId') ?? 'c'

      /* the canvas page as an editor has it open, with all its chrome; the
         test hands it the canvas the room would have sent */
      window.canvasPageHarness = {
        seed: (frames, canvas) =>
          useStore
            .getState()
            .setCanvas({ id: canvasId, name: 'Canvas', frames, role: 'edit', createdAt: 0, updatedAt: 0, ...canvas }),
        setPages: (pages) => useStore.getState().setPages(pages, canvasId),
        camera: () => useStore.getState().viewport,
        frameState: (id) => {
          const { canvas, activePageId, selectedId } = useStore.getState()
          return { frame: canvas?.frames.find((frame) => frame.id === id), activePageId, selectedId }
        },
        select: (id) => useStore.getState().select(id),
        setCamera: (viewport) => useStore.getState().setViewport(viewport),
        componentTypes: { stage: Stage, frame: FrameView },
        /* the canvas's shared styles as the room would send them after a change */
        setTokens: (tokens, themes) => useStore.getState().setTokensLocal(tokens, themes),
        setComponent: (component) => useStore.getState().setComponentLocal(component.id, component),
        frameHtml: (id) => useStore.getState().canvas.frames.find((frame) => frame.id === id).html,
      }
      createRoot(document.getElementById('root')).render(
        React.createElement(
          TooltipProvider,
          null,
          React.createElement(CanvasPage, { canvasId, guest: query.has('fixtureGuest') }),
        ),
      )
    </script>
  </body>
</html>
