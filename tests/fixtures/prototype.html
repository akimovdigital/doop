<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { flushSync } from 'react-dom'
      import { PrototypePlayer } from '/src/components/PrototypePlayer.tsx'
      import { AgentChat } from '/src/components/AgentChat.tsx'
      import { DesktopTabs } from '/src/components/DesktopTabs.tsx'
      import { ensureTab } from '/src/lib/desktop.ts'
      import { Stage } from '/src/components/Stage.tsx'
      import { TooltipProvider } from '/src/components/ui/tooltip.tsx'
      import { api } from '/src/lib/api.ts'
      import { useStore } from '/src/lib/store.ts'
      import { FRAME_BOOTSTRAP } from '/src/lib/frameRuntime.ts'
      import '/src/styles.css'
      const root = createRoot(document.getElementById('root'))
      window.messages = []
      window.prototypeInteractivity = new WeakMap()
      window.addEventListener('message', (ev) => {
        window.messages.push(ev.data)
        if (ev.source && ev.data?.type === 'doop:proto-result') {
          window.prototypeInteractivity.set(ev.source, ev.data.on)
        }
      })
      window.seed = (canvas) => useStore.getState().setCanvas(canvas)
      window.editFrame = (id, html) => {
        const frame = useStore.getState().canvas.frames.find((f) => f.id === id)
        useStore.getState().upsertFrame({ ...frame, html, updatedAt: frame.updatedAt + 1 })
      }
      window.playerClosed = false
      /* Match the app root's tooltip context for the player's context chips.
         Mount synchronously so tests cannot find screens from the previous player. */
      const mountPlayer = (props) =>
        flushSync(() =>
          root.render(
            React.createElement(
              TooltipProvider,
              null,
              React.createElement(PrototypePlayer, { key: `${props.startFrameId}:${Date.now()}`, ...props }),
            ),
          ),
        )
      window.play = (startFrameId) =>
        mountPlayer({
          startFrameId,
          onOpenChat: () => {
            useStore.getState().setPanelTab('tasks')
            useStore.getState().requestComposerFocus()
          },
          onClose: () => {
            window.playerClosed = true
            root.render(null)
          },
        })
      /* the full-page route's player: each navigation is a browser history entry */
      window.playWithShell = (startFrameId) => {
        const canvas = useStore.getState().canvas
        window.__DOOP_DESKTOP__ = '0.1.5'
        ensureTab(canvas.id, canvas.name)
        document.documentElement.classList.add('dark')
        flushSync(() =>
          root.render(
            React.createElement(
              TooltipProvider,
              null,
              React.createElement(DesktopTabs, { path: `/c/${canvas.id}` }),
              React.createElement(
                'main',
                { className: 'h-dvh pt-[38px] [--app-inset:38px]' },
                React.createElement(Stage, { onAddFrame: () => {} }),
                React.createElement(PrototypePlayer, { startFrameId, onClose: () => root.render(null) }),
              ),
            ),
          ),
        )
      }
      window.playSynced = (startFrameId) => mountPlayer({ startFrameId, syncUrl: true })
      /* a bare frame document, as the canvas mounts one: prototype mode stays
         off unless a test turns it on */
      window.addRawFrame = () => {
        const frame = document.createElement('iframe')
        frame.id = 'raw'
        frame.sandbox = 'allow-scripts'
        frame.srcdoc = FRAME_BOOTSTRAP
        frame.style.cssText = 'position:fixed;left:0;top:0;width:400px;height:300px;border:0;z-index:99'
        document.body.appendChild(frame)
      }
      /* the editor's stage, for Prototype mode's connectors */
      window.mountStage = (prototypeMode) => {
        useStore.getState().setPrototypeMode(prototypeMode)
        root.render(React.createElement(TooltipProvider, null, React.createElement(Stage, { onAddFrame: () => {} })))
      }
      window.designSends = []
      window.designUploads = []
      window.mockDesignSends = () => {
        api.agentAllowance = async () => ({ used: 0, limit: 10, byoModel: true })
        api.uploadAsset = async (_canvas, blob) => {
          const bitmap = await createImageBitmap(blob)
          const url = '/a/design-crop-' + encodeURIComponent(blob.name)
          window.designUploads.push({ name: blob.name, type: blob.type, width: bitmap.width, height: bitmap.height })
          const crop = document.createElement('canvas')
          crop.width = bitmap.width
          crop.height = bitmap.height
          const ctx = crop.getContext('2d')
          ctx.drawImage(bitmap, 0, 0)
          const pixels = ctx.getImageData(0, 0, crop.width, crop.height).data
          window.designCropHasMarkup = pixels.some(
            (value, index) => index % 4 === 0 && value === 1 && pixels[index + 1] === 119 && pixels[index + 2] === 211,
          )
          bitmap.close()
          return { url }
        }
        api.createFrame = async (_canvas, data) => ({ ...data, id: data.name })
        api.addCard = async (...args) => {
          window.designSends.push(args)
          if (window.designSendDelay) await new Promise((resolve) => setTimeout(resolve, window.designSendDelay))
          if (window.designSendError) throw new Error(window.designSendError)
          const store = useStore.getState()
          store.setTasks([
            ...store.tasks,
            {
              id: 'annotation-card',
              agentName: '',
              color: '',
              status: args[1],
              queuedBy: 'Test',
              startedAt: Date.now(),
            },
          ])
          return { id: 'annotation-card' }
        }
      }
      window.setDesignTasks = (tasks) => useStore.getState().setTasks(tasks)
      window.showDesignChat = () =>
        root.render(
          React.createElement(
            TooltipProvider,
            null,
            React.createElement(AgentChat, { className: 'dark ml-auto h-full max-w-sm bg-surface' }),
          ),
        )
      window.readDesignDraft = (canvasId) => useStore.getState().composerDrafts[canvasId]?.text ?? ''
      window.writeDesignDraft = (canvasId, draft) => useStore.getState().setComposerDraft(canvasId, draft)
      window.fixtureReady = true
    </script>
  </body>
</html>
